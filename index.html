<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대구대학교 문헌정보학과 카드뉴스</title>
  <meta name="description" content="도서관부터 데이터까지, 지식의 길을 만드는 대구대학교 문헌정보학과를 카드 11장으로 만나 보세요.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root {
      --green: #007870; --green-dark: #00574f; --lime: #D8E040;
      --bg: #f6f4ec; --ink: #1d2b29; --ink-soft: #5d6a66; --track: #d6dbd2;
      --w: min(740px, calc(100vw - 170px), calc((100vh - 170px) * 0.8));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
      word-break: keep-all; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }

    /* ── 위쪽 띠 ── */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      height: 58px; padding: 0 18px; background: var(--green); color: #fff;
    }
    .topbar .en { display: block; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--lime); }
    .topbar .ko { display: block; font-size: 16px; font-weight: 800; letter-spacing: -0.02em; }
    .share {
      border: 0; border-radius: 999px; padding: 9px 16px; cursor: pointer;
      background: var(--lime); color: var(--green-dark);
      font: 800 14px/1 'Pretendard', sans-serif;
    }

    .wrap { width: var(--w); margin: 0 auto; }

    /* ── 소개 ── */
    .hero { position: relative; padding: 38px 0 26px; }
    .hero .count { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--green); }
    .hero .bubble {
      position: relative; display: inline-block; margin-top: 14px;
      padding: 8px 16px; border-radius: 16px;
      background: var(--lime); color: var(--green-dark);
      font-size: 17px; font-weight: 900; transform: rotate(-4deg);
    }
    .hero .bubble::after {
      content: ''; position: absolute; left: 18px; bottom: -9px;
      border: 7px solid transparent; border-top: 9px solid var(--lime); border-bottom: 0;
    }
    .hero h1 {
      margin-top: 12px; max-width: 430px;
      font-size: clamp(36px, 8vw, 54px); font-weight: 900; line-height: 1.12; letter-spacing: -0.05em;
      color: var(--green);
    }
    .hero h1 span { color: var(--ink); }
    .hero .dodu { position: absolute; right: 0; top: 34px; width: clamp(110px, 24vw, 170px); }
    .hero .dept { margin-top: 20px; font-size: 17px; font-weight: 800; }
    .hero .desc { margin-top: 6px; font-size: 15px; line-height: 1.6; color: var(--ink-soft); }

    /* ── 카드 창 ── */
    .viewer { position: relative; }
    .frame {
      position: relative; width: var(--w); aspect-ratio: 1080 / 1350;
      border-radius: 28px; overflow: hidden; background: #fff;
      box-shadow: 0 22px 56px rgba(0, 60, 55, .16), 0 4px 12px rgba(0, 0, 0, .06);
    }
    .frame iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      transition: transform .5s cubic-bezier(.22, .8, .3, 1);
    }
    .nav-btn {
      position: absolute; top: 50%; z-index: 5; transform: translateY(-50%);
      width: 50px; height: 50px; border-radius: 50%; border: none;
      background: #fff; color: var(--green);
      font: 900 24px/1 'Pretendard', sans-serif; cursor: pointer;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .12);
      transition: transform .15s, background .15s, opacity .2s;
    }
    .nav-btn:hover { transform: translateY(-50%) scale(1.07); background: var(--lime); }
    .nav-btn.prev { right: calc(100% + 22px); }
    .nav-btn.next { left: calc(100% + 22px); }
    .nav-btn:disabled { opacity: 0; pointer-events: none; }
    .progress { margin-top: 16px; height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .progress span { display: block; height: 100%; background: var(--green); transition: width .5s cubic-bezier(.22, .8, .3, 1); }
    .counter { margin-top: 12px; text-align: center; font-size: 17px; color: #7a857f; }
    .counter b { font-weight: 900; color: var(--green-dark); }
    .hint { margin-top: 2px; text-align: center; font-size: 13px; color: #8a948f; }

    /* ── 버튼 ── */
    .actions { display: flex; flex-direction: column; gap: 10px; margin: 26px 0 44px; }
    .actions button {
      width: 100%; padding: 15px; border-radius: 12px; cursor: pointer;
      background: #fff; border: 1.5px solid var(--green); color: var(--green-dark);
      font: 800 16px/1 'Pretendard', sans-serif; transition: background .15s;
    }
    .actions button:hover { background: #eef5f3; }

    /* ── 전체 한눈에 보기 ── */
    .grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: -26px 0 44px; }
    .grid.open { display: grid; }
    .grid button { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
    .grid img { width: 100%; display: block; border-radius: 12px; box-shadow: 0 6px 16px rgba(0, 0, 0, .08); transition: transform .15s; }
    .grid button:hover img { transform: translateY(-3px); }
    .grid span { display: block; margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--green); }

    /* ── 바닥글 ── */
    footer { background: var(--green); color: #fff; padding: 30px 0 34px; }
    footer .wrap { display: flex; gap: 18px; align-items: flex-start; }
    footer .logo { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #fff; padding: 4px; }
    footer .name { font-size: 15px; font-weight: 800; }
    footer .links { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
    footer .links a { color: var(--lime); text-decoration: none; }
    footer .links a:hover { text-decoration: underline; }
    footer .note { margin-top: 12px; font-size: 12px; opacity: .75; }

    .toast {
      position: fixed; left: 50%; bottom: 30px; z-index: 50; transform: translate(-50%, 20px);
      padding: 12px 20px; border-radius: 999px; background: var(--ink); color: #fff;
      font-size: 14px; font-weight: 700; opacity: 0; pointer-events: none; transition: .25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ── 목차: 카드 창 왼쪽 ── */
    .toc {
      position: absolute; top: 0; right: calc(100% + 96px); width: 210px;
      padding: 18px 14px; border-radius: 20px; background: #fff;
      box-shadow: 0 10px 30px rgba(0, 60, 55, .08); border: 1px solid #e6e9e1;
    }
    .toc h2 { padding: 0 8px 10px; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--green); }
    .toc ol { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .toc button {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer;
      font: 700 15px/1.2 'Pretendard', sans-serif; color: var(--ink-soft); text-align: left;
      transition: background .15s, color .15s;
    }
    .toc button .n { flex: none; width: 24px; font-size: 12px; font-weight: 800; color: #9aa59f; }
    .toc button:hover { background: #f1f4ef; color: var(--ink); }
    .toc button.on { background: var(--green); color: #fff; }
    .toc button.on .n { color: var(--lime); }

    /* 화면이 넓지 않으면 목차를 카드 위 가로 줄로 */
    @media (max-width: 1240px) {
      :root { --w: min(740px, calc(100vw - 170px), calc((100vh - 230px) * 0.8)); }
      .toc {
        position: static; width: auto; margin-bottom: 14px; padding: 0;
        background: none; box-shadow: none; border: 0;
      }
      .toc h2 { display: none; }
      .toc ol { flex-direction: row; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .toc ol::-webkit-scrollbar { display: none; }
      .toc button { width: auto; white-space: nowrap; padding: 8px 12px; border-radius: 999px; background: #fff; border: 1px solid #e1e5dc; font-size: 13px; }
      .toc button .n { width: auto; }
      .toc button.on { border-color: var(--green); }
    }

    /* 좁은 화면: 화살표를 카드 위에 겹쳐 작게 */
    @media (max-width: 800px) {
      :root { --w: calc(100vw - 24px); }
      .nav-btn { width: 40px; height: 40px; font-size: 18px; background: rgba(255, 255, 255, .92); }
      .nav-btn.prev { right: auto; left: 8px; }
      .nav-btn.next { left: auto; right: 8px; }
      .grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* PDF 저장(인쇄): 카드 11장만 한 장씩 */
    .print { display: none; }
    @page { size: 1080px 1350px; margin: 0; }
    @media print {
      body > *:not(.print) { display: none !important; }
      .print { display: block; }
      .print img { display: block; width: 1080px; height: 1350px; break-after: page; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div><span class="en">DAEGU UNIVERSITY</span><span class="ko">대구대학교 문헌정보학과</span></div>
    <button class="share" id="share">링크 공유</button>
  </div>


  <section class="wrap" style="padding-top: 22px;">
    <div class="viewer">
      <nav class="toc" aria-label="목차"><h2>CONTENTS</h2><ol id="toc"></ol></nav>
      <button class="nav-btn prev" id="prev" aria-label="이전 카드">‹</button>
      <div class="frame" id="frame"></div>
      <button class="nav-btn next" id="next" aria-label="다음 카드">›</button>
    </div>
    <div class="progress"><span id="bar"></span></div>
    <p class="counter"><b id="now">01</b> / <span id="total"></span></p>
    <p class="hint">좌우로 넘겨 보세요</p>

    <div class="actions">
      <button id="all">전체 11장 한눈에 보기</button>
      <button id="pdf">PDF로 저장하기</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <div class="wrap">
      <img class="logo" src="images/du-symbol.png" alt="대구대학교">
      <div>
        <p class="name">대구대학교 사회과학대학 문헌정보학과</p>
        <p class="links">
          <a href="https://lis.daegu.ac.kr" target="_blank" rel="noopener">학과 홈페이지</a>
          <a href="https://www.instagram.com/daegu_univ_lis/" target="_blank" rel="noopener">인스타그램 @daegu_univ_lis</a>
          <a href="tel:053-850-6350">학과사무실 053-850-6350</a>
        </p>
        <p class="note">정확한 모집 및 학사 정보는 해당 학년도의 공식 안내를 확인해 주세요.</p>
      </div>
    </div>
  </footer>

  <div class="print" id="print"></div>
  <div class="toast" id="toast"></div>

  <script>
    const TOTAL = 11;
    const pad = n => String(n).padStart(2, '0');
    const frame = document.getElementById('frame');
    const grid = document.getElementById('grid');
    const print = document.getElementById('print');
    const frames = [];
    document.getElementById('total').textContent = pad(TOTAL);

    for (let i = 1; i <= TOTAL; i++) {
      // 카드 창: 11장 모두 미리 불러오기
      const f = document.createElement('iframe');
      f.title = i + '장';
      f.src = 'card' + pad(i) + '.html';
      frame.appendChild(f);
      frames.push(f);
      // 한눈에 보기 썸네일
      const b = document.createElement('button');
      b.innerHTML = '<img src="out/card' + pad(i) + '.png" alt="' + i + '장" loading="lazy"><span>' + pad(i) + '</span>';
      b.onclick = () => { go(i); document.querySelector('.viewer').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      grid.appendChild(b);
      // PDF용 이미지
      const p = document.createElement('img');
      p.src = 'out/card' + pad(i) + '.png'; p.alt = i + '장';
      print.appendChild(p);
    }

    // 목차 (카드 태그와 같은 이름)
    const TITLES = ['학과 소개', '문헌정보학과란?', '무엇을 배우나요?', '교수진', '전공강의실',
      '사회과학대 공간', '창파도서관', '학과 행사', '학과 동아리', '진로', '함께해요'];
    const toc = document.getElementById('toc');
    TITLES.forEach((t, i) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.innerHTML = '<span class="n">' + pad(i + 1) + '</span>' + t;
      b.onclick = () => go(i + 1);
      li.appendChild(b);
      toc.appendChild(li);
    });

    let cur = Math.min(Math.max(parseInt(location.hash.slice(1), 10) || 1, 1), TOTAL);

    function layout() {
      frames.forEach((f, i) => {
        const off = i + 1 - cur;
        f.style.transform = 'translateX(' + (off * 100) + '%)';
        f.style.visibility = Math.abs(off) <= 1 ? 'visible' : 'hidden';
        f.style.pointerEvents = off === 0 ? 'auto' : 'none';
        f.tabIndex = off === 0 ? 0 : -1;
      });
      document.getElementById('prev').disabled = cur === 1;
      document.getElementById('next').disabled = cur === TOTAL;
      document.getElementById('bar').style.width = (cur / TOTAL * 100) + '%';
      document.getElementById('now').textContent = pad(cur);
      [...document.querySelectorAll('#toc button')].forEach((b, i) => {
        const on = i + 1 === cur;
        b.classList.toggle('on', on);
        if (on) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current');
        if (on && getComputedStyle(b.parentNode.parentNode).flexDirection === 'row') {
          b.parentNode.parentNode.scrollTo({ left: b.parentNode.offsetLeft - 40, behavior: 'smooth' });
        }
      });
      history.replaceState(null, '', '#' + cur);
    }
    function go(n) {
      if (n < 1 || n > TOTAL || n === cur) return;
      cur = n; layout();
    }

    document.getElementById('prev').onclick = () => go(cur - 1);
    document.getElementById('next').onclick = () => go(cur + 1);
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') go(cur + 1);
      if (e.key === 'ArrowLeft') go(cur - 1);
    });
    addEventListener('message', e => { if (e.data && e.data.type === 'card-go') go(e.data.n); });

    // 전체 한눈에 보기
    const allBtn = document.getElementById('all');
    allBtn.onclick = () => {
      const open = grid.classList.toggle('open');
      allBtn.textContent = open ? '한눈에 보기 닫기' : '전체 11장 한눈에 보기';
    };
    // PDF로 저장하기 (인쇄 창에서 'PDF로 저장' 선택)
    document.getElementById('pdf').onclick = () => {
      toast('인쇄 창에서 대상(프린터)을 "PDF로 저장"으로 고르세요');
      setTimeout(() => window.print(), 400);
    };
    // 링크 공유
    const toastEl = document.getElementById('toast');
    function toast(msg) {
      toastEl.textContent = msg; toastEl.classList.add('show');
      clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }
    document.getElementById('share').onclick = async () => {
      const url = location.href.split('#')[0];
      if (navigator.share) { try { await navigator.share({ title: document.title, url }); return; } catch (e) {} }
      try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }
      catch (e) { prompt('아래 링크를 복사하세요', url); }
    };

    frames.forEach(f => f.style.transition = 'none');
    layout();
    requestAnimationFrame(() => requestAnimationFrame(() => frames.forEach(f => f.style.transition = '')));
  </script>
</body>
</html>
